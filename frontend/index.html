<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tài Sī - Voice Conversation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                charcoal: '#121212',
                imperialRed: '#ED2939',
                mexicanPink: '#E4007C',
                gold: '#FFD700',
              },
              animation: {
                'pulse-slow': 'pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                'float': 'float 6s ease-in-out infinite',
              },
              keyframes: {
                'pulse-ring': {
                  '0%, 100%': { transform: 'scale(1)', opacity: '0.8', 'box-shadow': '0 0 20px rgba(237, 41, 57, 0.5)' },
                  '50%': { transform: 'scale(1.1)', opacity: '1', 'box-shadow': '0 0 40px rgba(228, 0, 124, 0.7)' },
                },
                'float': {
                  '0%, 100%': { transform: 'translateY(0)' },
                  '50%': { transform: 'translateY(-10px)' },
                }
              }
            }
          }
        }
    </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
