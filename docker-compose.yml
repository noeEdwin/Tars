services:
  db:
    image: pgvector/pgvector:pg16 # Imagen oficial con soporte para vectores
    container_name: chinese_ai_db
    restart: always
    environment:
      POSTGRES_USER: lancelot # Tu usuario habitual
      POSTGRES_PASSWORD: 9474609
      POSTGRES_DB: chinese_tutor_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistencia completa

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tars_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_USER=lancelot
      - DB_PASS=9474609
      - DB_NAME=chinese_tutor_db
      - DB_HOST=db
      - DB_PORT=5432
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/tars.json
    env_file:
      - .env
    volumes:
      - ./agents:/app/agents
      - ./api.py:/app/api.py
      - ./main.py:/app/main.py
      - ./dataBase:/app/dataBase
      - ./ChatMessage:/app/ChatMessage
      - ./.env:/app/.env
      - /home/lancelot/Personal_Projects/tars.json:/credentials/tars.json:ro
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tars_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: # Definición del volumen nombrado