services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tars_backend
    restart: always
    ports:
      - "8000:8000"

    env_file:
      - .env
      
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/tars.json

    volumes:
      - ./dataBase:/app/dataBase
      - ${CERTS_PATH:-./certs}:/app/certs:ro
    command: >
      conda run --no-capture-output -n agentes_ia 
      uvicorn api.app:app 
      --host 0.0.0.0 
      --port 8000 
      --ssl-keyfile=/app/certs/key.pem 
      --ssl-certfile=/app/certs/cert.pem


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tars_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
    ports:
      - "3000:3000"
      - "222:22"
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
  runner:
    image: gitea/act_runner:latest
    container_name: gitea_runner
    restart: always
    network_mode: host
    environment:
      - CONFIG_FILE=/config.yaml
      - GITEA_INSTANCE_URL=http://100.69.250.70:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=H1J60QnW4MXIjqIXESYMmLdV1Yk78MEP61Wy0edi
    volumes:
      - ./runner_data:/data
      - ./runner_data/config.yaml:/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock